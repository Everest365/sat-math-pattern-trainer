<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Math 750 Lab | Module 2 Pattern &amp; Desmos Trainer</title>
  <script async src="https://desmos.com"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
    header { max-width: 1100px; width: 100%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    h1 { margin: 0; font-size: 1.55rem; color: #60a5fa; }
    .stats { display: flex; gap: 16px; align-items: center; font-weight: 600; color: #cbd5e1; }
    .workspace { max-width: 1100px; width: 100%; display: grid; grid-template-columns: 1fr; gap: 20px; }
    .workspace.split { grid-template-columns: 1fr 1fr; }
    @media (max-width: 850px) { .workspace.split { grid-template-columns: 1fr; } }
    .card { background: var(--card); padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    select, button { padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: var(--text); font-weight: 600; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.primary:hover { background: var(--accent-hover); }
    .question-box { font-size: 1.15rem; line-height: 1.65; background: #0f172a; padding: 20px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid var(--accent); }
    code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #93c5fd; font-size: 1.05rem; }
    .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1.1rem; }
    .solution-box { display: none; margin-top: 16px; padding: 16px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; line-height: 1.6; }
    #calculator { width: 100%; height: 480px; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>SAT Math 750 Lab</h1>
      <span style="color:var(--muted); font-size:0.9rem;">Infinite randomized Module 2 patterns + built-in Desmos</span>
    </div>
    <div class="stats">
      <span id="streak-text">Streak: 0</span>
      <span id="score-text">Solved: 0</span>
      <button type="button" id="desmos-btn">Show Desmos Calculator</button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <div class="card">
      <div class="toolbar">
        <select id="topic-select">
          <option value="all">All Hard Patterns (Mixed)</option>
          <option value="inf_solutions">Infinitely Many Solutions (Ratio Trick)</option>
          <option value="discriminant">Quadratic Discriminant (No Real Solutions)</option>
          <option value="vertex">Vertex Form &amp; Parabola Constants</option>
          <option value="circles">Circle Equations (Completing the Square)</option>
          <option value="exponential">Exponential Growth &amp; Percent Rate</option>
          <option value="trig">Right-Triangle Trig (Complementary Angles)</option>
        </select>
        <button type="button" class="primary" id="new-btn">New Problem</button>
      </div>

      <div class="question-box" id="question-text">Loading problem...</div>

      <div class="input-row">
        <input type="text" id="user-answer" placeholder="Enter exact number or fraction (e.g., 14 or 7/5)" />
        <button type="button" class="primary" id="check-btn">Check</button>
      </div>

      <div id="feedback" style="font-weight:700; min-height:24px;"></div>
      <div class="solution-box" id="solution-box"></div>
    </div>

    <div class="card" id="desmos-panel" style="display:none;">
      <div id="calculator"></div>
    </div>
  </div>

  <script>
    var currentProblem = null;
    var streak = 0;
    var solved = 0;
    var calculator = null;

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateProblem() {
      document.getElementById("user-answer").value = "";
      document.getElementById("feedback").innerText = "";
      document.getElementById("solution-box").style.display = "none";

      var choice = document.getElementById("topic-select").value;
      var types = ["inf_solutions", "discriminant", "vertex", "circles", "exponential", "trig"];
      var type = (choice === "all") ? types[randInt(0, types.length - 1)] : choice;

      if (type === "inf_solutions") {
        var mult = randInt(2, 5);
        var d = randInt(2, 9);
        var a = d * mult;
        var e = randInt(3, 11);
        var f = randInt(4, 15);
        var c = f * mult;

        currentProblem = {
          text: "In the system of equations below, <em>b</em> is a constant. If the system has <strong>infinitely many solutions</strong>, what is the value of <strong>a / d</strong> given:<br><br><code>" + a + "x + by = " + c + "</code><br><code>" + d + "x + " + e + "y = " + f + "</code>",
          answerVal: mult,
          answerDisplay: String(mult),
          solution: "<strong>Fast Algebra Method:</strong> For infinitely many solutions, the equations must be scalar multiples. Compare the x-coefficients or constants: <code>" + a + " / " + d + " = " + mult + "</code>.<br><br><strong>Desmos Trick:</strong> Type both equations in Desmos, add a slider for <code>b</code>, and set <code>b = " + (e * mult) + "</code> until the two lines overlap completely."
        };
      } else if (type === "discriminant") {
        var cVal = randInt(8, 35);
        var maxB = Math.floor(Math.sqrt(4 * cVal - 0.01));

        currentProblem = {
          text: "In the equation <code>x&sup2; + bx + " + cVal + " = 0</code>, <em>b</em> is a positive integer constant. If the equation has <strong>no real solutions</strong>, what is the <strong>greatest possible value</strong> of <em>b</em>?",
          answerVal: maxB,
          answerDisplay: String(maxB),
          solution: "<strong>Algebra Method:</strong> Set discriminant <code>b&sup2; - 4ac &lt; 0</code>: <code>b&sup2; &lt; " + (4 * cVal) + "</code>, so <code>b &lt; " + Math.sqrt(4 * cVal).toFixed(2) + "</code>. The greatest integer is <strong>" + maxB + "</strong>.<br><br><strong>Desmos Trick:</strong> Graph <code>y = x&sup2; + bx + " + cVal + "</code> with a slider for <code>b</code> and find the largest integer where the parabola stays above the x-axis."
        };
      } else if (type === "vertex") {
        var aVal = randInt(2, 4);
        var h = randInt(2, 6);
        var k = randInt(-10, -2);
        var x1 = h + 2;
        var y1 = aVal * Math.pow(x1 - h, 2) + k;
        var ans = aVal + k;

        currentProblem = {
          text: "A quadratic function <em>f</em> has a vertex at <code>(" + h + ", " + k + ")</code> and passes through <code>(" + x1 + ", " + y1 + ")</code>. What is the value of <strong>f(" + (h - 1) + ")</strong>?",
          answerVal: ans,
          answerDisplay: String(ans),
          solution: "<strong>Algebra Method:</strong> Use vertex form <code>f(x) = a(x - " + h + ")&sup2; + (" + k + ")</code>. Plugging in <code>(" + x1 + ", " + y1 + ")</code> gives <code>a = " + aVal + "</code>. Then <code>f(" + (h - 1) + ") = " + aVal + "(1) + (" + k + ") = <strong>" + ans + "</strong></code>."
        };
      } else if (type === "circles") {
        var hc = randInt(2, 6);
        var kc = randInt(2, 6);
        var r = randInt(3, 7);
        var D = -2 * hc;
        var E = -2 * kc;
        var F = hc * hc + kc * kc - r * r;

        currentProblem = {
          text: "In the xy-plane, the graph of <code>x&sup2; " + D + "x + y&sup2; " + E + "y + (" + F + ") = 0</code> is a circle. What is the <strong>radius</strong> of the circle?",
          answerVal: r,
          answerDisplay: String(r),
          solution: "<strong>Completing the Square:</strong> <code>(x - " + hc + ")&sup2; + (y - " + kc + ")&sup2; = " + (r * r) + "</code>, so <code>r = <strong>" + r + "</strong></code>.<br><br><strong>Desmos Trick:</strong> Graph the equation in Desmos, click the top and bottom points of the circle, and divide the diameter by 2."
        };
      } else if (type === "exponential") {
        var initial = randInt(2, 9) * 100;
        var pct = randInt(4, 18);
        var base = (1 + pct / 100).toFixed(2);
        var years = randInt(3, 6);

        currentProblem = {
          text: "The function <code>P(t) = " + initial + "(" + base + ")<sup>t/" + years + "</sup></code> models a population <em>t</em> years after 2020. By what <strong>percent</strong> does the population increase every <strong>" + years + " years</strong>?",
          answerVal: pct,
          answerDisplay: pct + "% (enter " + pct + ")",
          solution: "<strong>Exponent Structure Rule:</strong> Every time <code>t</code> increases by <code>" + years + "</code>, the exponent increases by 1, multiplying by <code>" + base + "</code>, which is a <strong>" + pct + "%</strong> increase."
        };
      } else {
        var num = randInt(3, 8);
        var den = randInt(num + 1, 13);

        currentProblem = {
text: "In right triangle ABC, angle C is 90° and sin(A) = " + num + "/" + den + ". What is the value of cos(B)? (Enter as a fraction like " + num + "/" + den + ")",
answerVal: num / den,
answerDisplay: num + "/" + den,
solution: "Complementary Angle Identity: Since A + B = 90°, sin(A) = cos(B) = " + num + "/" + den + "."
};
}
document.getElementById("question-text").innerHTML = currentProblem.text;
}
function parseFraction(str) {
str = str.trim().replace("%", "");
var slashIdx = str.indexOf("/");
if (slashIdx > 0) {
var num = Number(str.slice(0, slashIdx));
var den = Number(str.slice(slashIdx + 1));
if (!isNaN(num) && !isNaN(den) && den !== 0) {
return num / den;
}
}
return Number(str);
}
function checkAnswer() {
if (!currentProblem) return;
var raw = document.getElementById("user-answer").value;
var val = parseFraction(raw);
var fb = document.getElementById("feedback");
var solBox = document.getElementById("solution-box");
if (isNaN(val) || raw.trim() === "") {
fb.style.color = "var(--danger)";
fb.innerText = "Please enter a valid number or fraction.";
return;
}
if (Math.abs(val - currentProblem.answerVal) < 0.001) {
fb.style.color = "var(--success)";
fb.innerText = "Correct! (" + currentProblem.answerDisplay + ")";
streak++;
solved++;
} else {
fb.style.color = "var(--danger)";
fb.innerText = "Incorrect — the answer is " + currentProblem.answerDisplay + ".";
streak = 0;
}
document.getElementById("streak-text").innerText = "Streak: " + streak;
document.getElementById("score-text").innerText = "Solved: " + solved;
solBox.innerHTML = currentProblem.solution;
solBox.style.display = "block";
}
function toggleDesmos() {
var panel = document.getElementById("desmos-panel");
var ws = document.getElementById("workspace");
var btn = document.getElementById("desmos-btn");
if (panel.style.display === "none") {
panel.style.display = "block";
ws.classList.add("split");
btn.innerText = "Hide Desmos Calculator";
if (!calculator) {
if (typeof Desmos !== "undefined") {
calculator = Desmos.GraphingCalculator(document.getElementById("calculator"));
} else {
document.getElementById("calculator").innerHTML = "Desmos API blocked on this network. Open desmos.com in a separate tab.";
}
}
} else {
panel.style.display = "none";
ws.classList.remove("split");
btn.innerText = "Show Desmos Calculator";
}
}
document.getElementById("topic-select").addEventListener("change", generateProblem);
document.getElementById("new-btn").addEventListener("click", generateProblem);
document.getElementById("check-btn").addEventListener("click", checkAnswer);
document.getElementById("desmos-btn").addEventListener("click", toggleDesmos);
document.getElementById("user-answer").addEventListener("keydown", function(e) {
if (e.key === "Enter") checkAnswer();
});
generateProblem();
