<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAT Math 750 Lab | Module 2 Pattern & Desmos Trainer</title>
  <script async src="https://desmos.com"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
    header { max-width: 1100px; width: 100%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    h1 { margin: 0; font-size: 1.55rem; color: #60a5fa; }
    .stats { display: flex; gap: 16px; align-items: center; font-weight: 600; color: #cbd5e1; }
    .workspace { max-width: 1100px; width: 100%; display: grid; grid-template-columns: 1fr; gap: 20px; }
    .workspace.split { grid-template-columns: 1fr 1fr; }
    @media (max-width: 850px) { .workspace.split { grid-template-columns: 1fr; } }
    .card { background: var(--card); padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    select, button { padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: var(--text); font-weight: 600; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.primary:hover { background: var(--accent-hover); }
    .question-box { font-size: 1.15rem; line-height: 1.65; background: #0f172a; padding: 20px; border-radius: 8px; margin-bottom: 16px; border-left: 4px solid var(--accent); }
    code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #93c5fd; font-size: 1.05rem; }
    .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1.1rem; }
    .solution-box { display: none; margin-top: 16px; padding: 16px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; line-height: 1.6; }
    #calculator { width: 100%; height: 480px; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>SAT Math 750 Lab</h1>
      <span style="color:var(--muted); font-size:0.9rem;">Infinite randomized Module 2 patterns + built-in Desmos</span>
    </div>
    <div class="stats">
      <span id="streak-text">Streak: 0 🔥</span>
      <span id="score-text">Solved: 0</span>
      <button onclick="toggleDesmos()" id="desmos-btn">Show Desmos Calculator</button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <div class="card">
      <div class="toolbar">
        <select id="topic-select" onchange="generateProblem()">
          <option value="all">All Hard Patterns (Mixed)</option>
          <option value="inf_solutions">Infinitely Many Solutions (Ratio Trick)</option>
          <option value="discriminant">Quadratic Discriminant (No Real Solutions)</option>
          <option value="vertex">Vertex Form & Parabola Constants</option>
          <option value="circles">Circle Equations (Completing the Square)</option>
          <option value="exponential">Exponential Growth & Percent Rate</option>
          <option value="trig">Right-Triangle Trig (Complementary Angles)</option>
        </select>
        <button class="primary" onclick="generateProblem()">New Problem ↻</button>
      </div>

      <div class="question-box" id="question-text"></div>

      <div class="input-row">
        <input type="text" id="user-answer" placeholder="Enter exact number or fraction (e.g., 14 or 7/5)" onkeydown="if(event.key==='Enter') checkAnswer()" />
        <button class="primary" onclick="checkAnswer()">Check</button>
      </div>

      <div id="feedback" style="font-weight:700; min-height:24px;"></div>
      <div class="solution-box" id="solution-box"></div>
    </div>

    <div class="card" id="desmos-panel" style="display:none;">
      <div id="calculator"></div>
    </div>
  </div>

  <script>
    let currentProblem = null;
    let streak = 0;
    let solved = 0;
    let calculator = null;

    function toggleDesmos() {
      const panel = document.getElementById('desmos-panel');
      const ws = document.getElementById('workspace');
      const btn = document.getElementById('desmos-btn');
      if (panel.style.display === 'none') {
        panel.style.display = 'block';
        ws.classList.add('split');
        btn.innerText = 'Hide Desmos Calculator';
        if (!calculator) {
          calculator = Desmos.GraphingCalculator(document.getElementById('calculator'));
        }
      } else {
        panel.style.display = 'none';
        ws.classList.remove('split');
        btn.innerText = 'Show Desmos Calculator';
      }
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateProblem() {
      document.getElementById('user-answer').value = '';
      document.getElementById('feedback').innerText = '';
      document.getElementById('solution-box').style.display = 'none';

      const choice = document.getElementById('topic-select').value;
      const types = ['inf_solutions', 'discriminant', 'vertex', 'circles', 'exponential', 'trig'];
      const type = choice === 'all' ? types[randInt(0, types.length - 1)] : choice;

      if (type === 'inf_solutions') {
        const mult = randInt(2, 5);
        const d = randInt(2, 9);
        const a = d * mult;
        const e = randInt(3, 11);
        const f = randInt(4, 15);
        const c = f * mult;

        currentProblem = {
          text: `In the system of equations below, <em>b</em> is a constant. If the system has <strong>infinitely many solutions</strong>, what is the value of <strong>a / d</strong> given:<br><br>
                 <code>${a}x + by = ${c}</code><br>
                 <code>${d}x + ${e}y = ${f}</code>`,
          answerVal: mult,
          answerDisplay: `${mult}`,
          solution: `<strong>Fast Algebra Method:</strong> For infinitely many solutions, the two equations must be scalar multiples of each other. Compare the x-coefficients or constants: <code>${a} / ${d} = ${mult}</code> (and <code>${c} / ${f} = ${mult}</code>).<br><br>
                     <strong>Desmos Trick:</strong> Enter both equations in Desmos, add a slider for <code>b</code>, and set <code>b = ${e * mult}</code> until both lines overlap completely.`
        };
      } else if (type === 'discriminant') {
        const c = randInt(8, 35);
        const maxB = Math.floor(Math.sqrt(4 * c - 0.01));

        currentProblem = {
          text: `In the equation <code>x² + bx + ${c} = 0</code>, <em>b</em> is a positive integer constant. If the equation has <strong>no real solutions</strong>, what is the <strong>greatest possible value</strong> of <em>b</em>?`,
          answerVal: maxB,
          answerDisplay: `${maxB}`,
          solution: `<strong>Algebra Method:</strong> Set the discriminant <code>b² - 4ac &lt; 0</code>:<br>
                     <code>b² - 4(1)(${c}) &lt; 0</code> → <code>b² &lt; ${4 * c}</code>.<br>
                     Taking the square root gives <code>b &lt; ${Math.sqrt(4 * c).toFixed(2)}</code>, so the greatest integer is <strong>${maxB}</strong>.<br><br>
                     <strong>Desmos Trick:</strong> Graph <code>y = x² + bx + ${c}</code> with a slider for <code>b</code> and find the largest integer where the parabola stays strictly above the x-axis.`
        };
      } else if (type === 'vertex') {
        const a = randInt(2, 4);
        const h = randInt(2, 6);
        const k = randInt(-10, -2);
        const x1 = h + 2;
        const y1 = a * Math.pow(x1 - h, 2) + k;
        const ans = a + k;

        currentProblem = {
          text: `A quadratic function <em>f</em> has a vertex at <code>(${h}, ${k})</code> and passes through the point <code>(${x1}, ${y1})</code>. What is the value of <strong>f(${h - 1})</strong>?`,
          answerVal: ans,
          answerDisplay: `${ans}`,
          solution: `<strong>Algebra Method:</strong> Use vertex form <code>f(x) = a(x - ${h})² + (${k})</code>.<br>
                     Plug in <code>(${x1}, ${y1})</code>: <code>${y1} = a(${x1} - ${h})² + (${k})</code> → <code>${y1 - k} = 4a</code> → <code>a = ${a}</code>.<br>
                     Then <code>f(${h - 1}) = ${a}(${h - 1} - ${h})² + (${k}) = ${a} + (${k}) = <strong>${ans}</strong></code>.<br><br>
                     <strong>Desmos Trick:</strong> Use quadratic regression <code>y₁ ~ a(x₁ - ${h})² + ${k}</code> with a table containing <code>(${x1}, ${y1})</code>.`
        };
      } else if (type === 'circles') {
        const h = randInt(2, 6);
        const k = randInt(2, 6);
        const r = randInt(3, 7);
        const D = -2 * h;
        const E = -2 * k;
        const F = h * h + k * k - r * r;

        currentProblem = {
          text: `In the xy-plane, the graph of <code>x² ${D}x + y² ${E}y + (${F}) = 0</code> is a circle. What is the <strong>radius</strong> of the circle?`,
          answerVal: r,
          answerDisplay: `${r}`,
          solution: `<strong>Completing the Square:</strong> Group x and y terms and take half of each linear coefficient squared:<br>
                     <code>(x - ${h})² + (y - ${k})² = ${-F} + ${h * h} + ${k * k} = ${r * r}</code>.<br>
Since r² = ${r * r}, the radius is r = ${r}.`


Desmos Trick: Graph the equation directly in Desmos, click the top and bottom points of the circle, and divide the diameter by 2.`
};
} else if (type === 'exponential') {
const initial = randInt(2, 9) * 100;
const pct = randInt(4, 18);
const base = (1 + pct / 100).toFixed(2);
const years = randInt(3, 6);
currentProblem = {
text: The function <code>P(t) = ${initial}(${base})<sup>t/${years}</sup></code> models a population <em>t</em> years after 2020. By what <strong>percent</strong> does the population increase every <strong>${years} years</strong>?,
answerVal: pct,
answerDisplay: ${pct}% (enter ${pct}),
solution: <strong>Exponent Structure Rule:</strong> Notice the exponent is <code>t/${years}</code>. Every time <code>t</code> increases by <code>${years}</code>, the exponent increases by 1, multiplying the population by <code>${base}</code>.<br> Since <code>${base} = 1 + ${pct / 100}</code>, the growth rate every ${years} years is <strong>${pct}%</strong>.
};
} else {
const num = randInt(3, 8);
const den = randInt(num + 1, 13);
currentProblem = {
text: In right triangle <em>ABC</em>, angle <em>C</em> is 90° and <code>sin(A) = ${num}/${den}</code>. What is the value of <strong>cos(B)</strong>? (Enter as a fraction like ${num}/${den}),
answerVal: num / den,
answerDisplay: ${num}/${den},
solution: <strong>Complementary Angle Identity:</strong> Because angles <em>A</em> and <em>B</em> are acute angles in a right triangle, <code>A + B = 90°</code>.<br> On the SAT, <code>sin(A) = cos(90° - A) = cos(B)</code> always! Therefore, <code>cos(B) = <strong>${num}/${den}</strong></code>.
};
}
document.getElementById('question-text').innerHTML = currentProblem.text;
}
function parseFraction(str) {
str = str.trim().replace('%', '');
const slashIdx = str.indexOf('/');
if (slashIdx > 0) {
const num = Number(str.slice(0, slashIdx));
const den = Number(str.slice(slashIdx + 1));
if (!isNaN(num) && !isNaN(den) && den !== 0) {
return num / den;
}
}
return Number(str);
}
function checkAnswer() {
const raw = document.getElementById('user-answer').value;
const val = parseFraction(raw);
const fb = document.getElementById('feedback');
const solBox = document.getElementById('solution-box');
if (isNaN(val) || raw.trim() === '') {
fb.style.color = 'var(--danger)';
fb.innerText = 'Please enter a valid number or fraction.';
return;
}
if (Math.abs(val - currentProblem.answerVal) < 0.001) {
fb.style.color = 'var(--success)';
fb.innerText = Correct! (${currentProblem.answerDisplay});
streak++;
solved++;
} else {
fb.style.color = 'var(--danger)';
fb.innerText = Incorrect — the answer is ${currentProblem.answerDisplay}.;
streak = 0;
}
document.getElementById('streak-text').innerText = Streak: ${streak} 🔥;
document.getElementById('score-text').innerText = Solved: ${solved};
solBox.innerHTML = currentProblem.solution;
solBox.style.display = 'block';
}
generateProblem();
